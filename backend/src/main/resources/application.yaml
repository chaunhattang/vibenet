spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Fail fast instead of hanging the request thread if Redis is slow/unreachable;
      # the notification/moment read paths all fall back to the DB on Redis errors.
      timeout: 2000ms
      connect-timeout: 2000ms
      # Lettuce is thread-safe on a shared connection, so no pool is required for v1.
      # To enable pooling, add the commons-pool2 dependency and a spring.data.redis.lettuce.pool block.

springdoc:
  swagger-ui:
    path: /swagger

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    expiration-in-ms: ${JWT_EXPIRATION_IN_MS}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@vibenet.local}
    password: ${ADMIN_PASSWORD:}

file:
  upload-dir: ${FILE_UPLOAD_DIR}
