<svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- VibeNet Signature Gradient -->
    <linearGradient id="vibeBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="30%" stop-color="#8A2387" />
      <stop offset="70%" stop-color="#6A11CB" />
      <stop offset="100%" stop-color="#2575FC" />
    </linearGradient>

    <linearGradient id="ribbonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F4FF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="accentRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="0" y="0" width="100" height="100" rx="30" fill="url(#vibeBgGrad)" />

  <!-- Ambient Top Gloss Line -->
  <path d="M20 10 Q50 4 80 10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.3" />

  <!-- The Signature VibeNet 'V' Emblem -->
  <g transform="translate(0, 4)">
    <!-- Main Dynamic 'V' Ribbon -->
    <path d="M26 26 C30 26 34 29 37 36 L50 63 L63 36 C66 29 70 26 74 26 C81 26 85 33 80 41 L57 80 C53.5 86 46.5 86 43 80 L20 41 C15 33 19 26 26 26 Z" fill="url(#ribbonGrad1)" />

