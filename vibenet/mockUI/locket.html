<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babagang - Moment</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f2f6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      color: #000;
    }

    /* Mobile Frame Container */
    .app-screen {
      width: 100%;
      max-width: 412px;
      background: #000000; /* Dark background for camera / moment vibe */
      min-height: 100vh;
      position: relative;
      padding-bottom: 100px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      overflow-x: hidden;
      color: #ffffff;
    }

    /* Status Bar */
    .status-bar {
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .dynamic-island {
      width: 90px;
      height: 28px;
      background: #1a1a1a;
      border-radius: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* Audience / Recipient Selector Pill */
    .recipient-selector {
      display: flex;
      justify-content: center;
      margin: 8px 0 16px;
    }

    .recipient-pill {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }

    .recipient-pill img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    /* Main Viewfinder / Moment Card */
    .moment-card-container {
      padding: 0 16px;
      position: relative;
    }

    .moment-card {
      width: 100%;
      height: 380px;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      background: #1c1c1e;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .moment-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Live Timestamp & Sender Badge Overlay */
    .moment-sender-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .moment-sender-badge img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    /* Emoji Quick Reactions Bar */
    .reaction-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 20px 0;
    }

    .reaction-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .reaction-btn:active {
      transform: scale(1.2);
    }

    /* Shutter & Camera Controls */
    .camera-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 40px;
    }

    .shutter-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active .shutter-inner {
      transform: scale(0.85);
    }

    /* Recent Moments Strip */
    .history-section {
      padding: 20px 16px 0;
    }

    .history-title {
      font-size: 13px;
      font-weight: 600;
      color: #8e8e93;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .history-grid::-webkit-scrollbar { display: none; }

    .history-item {
      min-width: 80px;
      height: 100px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    .history-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .history-time {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      background: rgba(0,0,0,0.6);
      padding: 2px 0;
    }

    /* Floating Navigation Bar */
    .floating-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 64px);
      max-width: 348px;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .nav-item {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8e8e93;
      text-decoration: none;
      font-size: 18px;
    }

    .nav-item.active {
      background: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="dynamic-island"></div>
      <div style="display: flex; gap: 6px; font-size: 12px;">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <!-- Header -->
    <header class="header">
      <a href="feed.html" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="header-title">Moments</div>
      <button class="icon-btn"><i class="fa-solid fa-gear"></i></button>
    </header>

    <!-- Recipient Selector Button -->
    <div class="recipient-selector">
      <div class="recipient-pill">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Katty">
        <span>To: Katty Abrahams</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px; opacity: 0.7;"></i>
      </div>
    </div>

    <!-- Live View / Latest Moment Received -->
    <div class="moment-card-container">
      <div class="moment-card">
        <img class="moment-image" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800" alt="Latest Moment">
        
        <div class="moment-sender-badge">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Katty">
          <span>Katty • 12m ago</span>
        </div>
      </div>
    </div>

    <!-- Quick Emoji Reaction Strip -->
    <div class="reaction-bar">
      <button class="reaction-btn">❤️</button>
      <button class="reaction-btn">🔥</button>
      <button class="reaction-btn">😂</button>
      <button class="reaction-btn">😮</button>
      <button class="reaction-btn">💬</button>
    </div>

    <!-- Camera Controls (Flip - Shutter - Flash) -->
    <div class="camera-controls">
      <button class="icon-btn"><i class="fa-solid fa-image"></i></button>
      
      <button class="shutter-btn">
        <div class="shutter-inner"></div>
      </button>

      <button class="icon-btn"><i class="fa-solid fa-rotate-left"></i></button>
    </div>

    <!-- History / Past Moments -->
    <div class="history-section">
      <div class="history-title">Recent Moments</div>
      <div class="history-grid">
        <div class="history-item">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=300" alt="History 1">
          <div class="history-time">Yesterday</div>
        </div>
        <div class="history-item">
          <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=300" alt="History 2">
          <div class="history-time">Tue</div>
        </div>
        <div class="history-item">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300" alt="History 3">
          <div class="history-time">Mon</div>
        </div>
      </div>
    </div>

    <!-- Floating Navigation Bar -->
    <nav class="floating-nav">
      <a href="feed.html" class="nav-item"><i class="fa-regular fa-house"></i></a>
      <a href="moment.html" class="nav-item active"><i class="fa-solid fa-camera"></i></a>
      <a href="notifications.html" class="nav-item"><i class="fa-regular fa-heart"></i></a>
      <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i></a>
    </nav>

  </div>

</body>
</html>
